name: Проверка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты, Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Сборка интерфейса
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  start:
    name: Запуск по README, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v5

      - name: ./run.sh и проверка сервера
        if: runner.os != 'Windows'
        run: |
          ./run.sh 8000 > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf --max-time 5 http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -sf --max-time 10 http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl -sf --max-time 60 -X POST http://127.0.0.1:8000/api/plan/solve \
            -H 'Content-Type: application/json' -d '{"region": "east"}' > /dev/null

      - name: run.bat и проверка сервера
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/c', '.\run.bat 8000 > server.log 2>&1'
          $up = $false
          for ($i = 0; $i -lt 90 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8000/api/health -TimeoutSec 5 | Out-Null; $up = $true }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $up) { throw "Сервер не ответил" }
          $page = Invoke-WebRequest http://127.0.0.1:8000/ -TimeoutSec 10
          if ($page.Content -notmatch 'id="root"') { throw "Нет страницы интерфейса" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8000/api/plan/solve -TimeoutSec 60 `
            -ContentType 'application/json' -Body '{"region": "east"}' | Out-Null

      - name: Журнал сервера
        if: always()
        shell: bash
        run: cat server.log 2>/dev/null || echo "server.log не создан"

      - name: Журнал сервера в аннотации
        if: failure()
        shell: bash
        run: |
          if [ -f server.log ]; then
            msg=$(tail -c 3000 server.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')
          else
            msg="server.log не создан"
          fi
          echo "::error title=server.log::${msg}"
