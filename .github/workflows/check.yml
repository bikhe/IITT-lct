name: Проверка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты, Python 3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Сборка интерфейса
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  start:
    name: Запуск по README, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - name: ./run.sh
        if: runner.os != 'Windows'
        run: ./run.sh 8000 > server.log 2>&1 &
      - name: run.bat
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process cmd.exe -ArgumentList '/c', '.\run.bat 8000 > server.log 2>&1'
      - name: Сервер отвечает
        shell: bash
        run: |
          for i in $(seq 1 120); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ | grep -q 'id="root"'
          curl -sf -X POST http://127.0.0.1:8000/api/plan/solve \
            -H 'Content-Type: application/json' -d '{"region": "east"}' > /dev/null
      - name: Журнал сервера
        if: always()
        shell: bash
        run: cat server.log || true
